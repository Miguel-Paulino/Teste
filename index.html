<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05060f">
<title>Lunar Colony: Sobrevivência na Lua</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="bar">
  <button id="bBuild" title="Construir (B)">🔨</button>
  <button id="bMenu" title="Menu (M)">☰</button>
  <button id="bSnd" title="Som">🔊</button>
  <button id="bFs" title="Tela cheia (F)">⛶</button>
</div>
<div id="toast"></div>
<div id="panel"></div>
<div id="pad">
  <div class="dp"><button data-k="up">▲</button><button data-k="left">◀</button><button data-k="right">▶</button><button data-k="down">▼</button></div>
  <div class="ab"><button data-k="act">A</button></div>
</div>
<div id="start" class="on">
  <div class="box">
    <h1>LUNAR COLONY</h1>
    <p>Sobrevivência na Lua</p>
    <div class="opts">
      <button id="sNew">Novo jogo</button>
      <button id="sCont">Continuar</button>
      <button id="sFs">Tela cheia</button>
    </div>
    <small>Setas/WASD mover · E ou Espaço interagir · B construir · M menu · F tela cheia</small>
  </div>
</div>
<script src="js/data.js"></script>
<script src="js/game.js"></script>
</body>
</html>
